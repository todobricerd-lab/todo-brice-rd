<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
<!--
  Acceso al catálogo desde el celular.

  Está escrito a mano, sin framework ni CDN, por dos razones: carga en
  una conexión mala y no depende de que un servicio de terceros siga
  existiendo dentro de dos años.

  La contraseña no está aquí: se manda a /api/sesion y el servidor la
  compara con un secreto de Cloudflare. Lo único que guarda el navegador
  es una cookie firmada que él no puede falsificar.
-->
<style>
  :root {
    --azul: #1F2A60; --verde: #2E9E46; --naranja: #E8751A;
    --fondo: #F4F6FA; --panel: #FFFFFF; --borde: #DCE3ED;
    --texto: #16203A; --suave: #64748B; --rojo: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-bottom: 96px;
  }
  header {
    background: var(--azul); color: #fff; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header b { font-size: 17px; }
  header small { color: #A9B6D6; display: block; font-size: 12.5px; }
  header button { margin-left: auto; }

  .env { max-width: 760px; margin: 0 auto; padding: 16px; }

  button {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px;
    border: 1px solid transparent; padding: 11px 16px;
  }
  .primario { background: var(--verde); color: #fff; }
  .neutro { background: var(--panel); color: var(--texto); border-color: var(--borde); }
  .peligro { background: transparent; color: var(--rojo); border-color: #F0C9C4; padding: 7px 12px; font-size: 14px; }
  .chico { padding: 8px 13px; font-size: 14px; }

  label { display: block; margin-top: 12px; font-size: 13.5px; font-weight: 700; color: var(--suave); }
  input {
    font: inherit; width: 100%; margin-top: 5px; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 10px; background: #fff; color: var(--texto);
  }
  input:focus { outline: 3px solid rgba(46,158,70,.35); outline-offset: 1px; border-color: var(--verde); }

  .tarjeta {
    background: var(--panel); border: 1px solid var(--borde);
    border-radius: 14px; padding: 16px; margin-top: 14px;
  }
  .categoria > summary {
    cursor: pointer; font-weight: 800; font-size: 17px; color: var(--azul);
    list-style: none; display: flex; align-items: center; gap: 9px; padding: 4px 0;
  }
  .categoria > summary::-webkit-details-marker { display: none; }
  .categoria > summary::before { content: "▸"; color: var(--suave); font-size: 14px; }
  .categoria[open] > summary::before { content: "▾"; }
  .categoria > summary span { font-weight: 500; font-size: 13px; color: var(--suave); }

  /* ── Buscador ──────────────────────────────────────────────
     Con treinta productos por sección, desplegarlo todo y bajar
     buscando con el dedo no es viable en un celular. */
  .buscar { position: relative; }
  .buscar input { margin-top: 0; padding-left: 38px; }
  .buscar::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 15px; opacity: .55;
  }
  .sin-resultados { color: var(--suave); font-size: 14px; padding: 18px 2px; }

  /* ── Productos: cerrados por defecto ───────────────────────
     Antes se pintaban todos abiertos y la sección quedaba de
     varias pantallas de alto. */
  .producto { border: 1px solid var(--borde); border-radius: 12px; margin-top: 10px; background: #FCFDFF; }
  .producto > summary {
    cursor: pointer; list-style: none; padding: 10px 12px;
    display: flex; align-items: center; gap: 11px;
  }
  .producto > summary::-webkit-details-marker { display: none; }
  .producto[open] > summary { border-bottom: 1px solid var(--borde); }
  .producto .cuerpo { padding: 4px 14px 14px; }
  .producto .titulo { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .producto .titulo.vacio { color: var(--suave); font-weight: 500; font-style: italic; }
  .producto .cuantos { font-size: 12.5px; color: var(--suave); white-space: nowrap; }
  .mini {
    width: 40px; height: 40px; border-radius: 9px; flex: none;
    object-fit: contain; background: #fff; border: 1px solid var(--borde);
  }
  .mini.vacia { display: flex; align-items: center; justify-content: center; font-size: 17px; opacity: .45; }

  .precio { display: flex; gap: 9px; align-items: flex-end; margin-top: 9px; }
  .precio > div:first-child { flex: 1.6; }
  .precio > div:nth-child(2) { flex: 1; }
  .precio label { margin-top: 0; }
  .fila-botones { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }

  /* ── Caja de la foto ───────────────────────────────────────
     Tres maneras de poner la misma foto: elegir archivo, soltarla
     encima, o copiar y pegar. En el celular el botón abre la cámara
     o la galería; en la computadora, pegar es lo más rápido. */
  .foto {
    display: flex; gap: 12px; align-items: center; margin-top: 8px;
    border: 1.5px dashed var(--borde); border-radius: 12px; padding: 10px;
    background: #fff; cursor: pointer;
  }
  .foto:focus { outline: 3px solid rgba(46,158,70,.35); outline-offset: 1px; border-color: var(--verde); }
  .foto.encima { border-color: var(--verde); background: #F1FBF3; }
  .foto .vista {
    width: 68px; height: 68px; flex: none; border-radius: 10px;
    object-fit: contain; background: #fff; border: 1px solid var(--borde);
  }
  .foto .hueco {
    width: 68px; height: 68px; flex: none; border-radius: 10px;
    background: var(--fondo); border: 1px solid var(--borde);
    display: flex; align-items: center; justify-content: center; font-size: 24px; opacity: .5;
  }
  .foto .texto { flex: 1; min-width: 0; }
  .foto .pista { font-size: 12.5px; color: var(--suave); margin: 4px 0 0; }
  .foto .pista.malo { color: var(--rojo); font-weight: 700; }
  .foto .acciones { display: flex; gap: 8px; flex-wrap: wrap; }

  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--borde); padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .barra .env { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; }
  .aviso { font-size: 13.5px; color: var(--suave); }
  .aviso.malo { color: var(--rojo); font-weight: 700; }
  .aviso.bien { color: var(--verde); font-weight: 700; }

  /* ── Pestañas ──────────────────────────────────────────────
     Lo general primero, que es lo que se toca de vez en cuando; el
     catálogo después, que es lo de todos los días pero mucho más largo. */
  .pestanas {
    display: flex; gap: 4px; background: var(--azul); padding: 0 16px;
    position: sticky; top: 61px; z-index: 9; overflow-x: auto;
  }
  .pestanas button {
    background: transparent; color: #A9B6D6; border: 0; border-radius: 0;
    padding: 11px 14px; font-size: 14.5px; white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  .pestanas button.activa { color: #fff; border-bottom-color: var(--naranja); }

  .grupo { margin-top: 18px; }
  .grupo > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--suave); margin: 0 0 2px;
  }
  .nota { font-size: 12.5px; color: var(--suave); margin: 4px 0 0; }
  .red { border: 1px solid var(--borde); border-radius: 12px; padding: 12px; margin-top: 10px; background: #FCFDFF; }
  select {
    font: inherit; width: 100%; margin-top: 5px; padding: 11px 12px;
    border: 1px solid var(--borde); border-radius: 10px; background: #fff; color: var(--texto);
  }

  .entrada { max-width: 380px; margin: 14vh auto; padding: 0 16px; }
  .entrada .tarjeta { text-align: center; }
  .entrada h1 { font-size: 21px; margin: 0 0 4px; color: var(--azul); }
  .entrada p { margin: 0; color: var(--suave); font-size: 14px; }
  .entrada button { width: 100%; margin-top: 16px; }
  .oculto { display: none !important; }
</style>
</head>
<body>

<!-- ══════════ Entrar ══════════ -->
<section class="entrada" id="entrada">
  <div class="tarjeta">
    <h1>Acceso restringido</h1>
    <p>Solo para personal autorizado.</p>
    <form id="form-entrar">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" autocomplete="current-password" required>
      <button class="primario" type="submit">Entrar</button>
    </form>
    <p class="aviso malo oculto" id="error-entrar" role="status"></p>
  </div>
</section>

<!-- ══════════ Editor ══════════ -->
<div id="editor" class="oculto">
  <header>
    <div>
      <b>Todo Brice</b>
      <small>Edición del sitio</small>
    </div>
    <button class="neutro chico" id="salir">Salir</button>
  </header>

  <nav class="pestanas">
    <button type="button" data-hoja="general" class="activa">Información general</button>
    <button type="button" data-hoja="catalogo">Catálogo</button>
  </nav>

  <!-- ══════ Hoja: información general ══════ -->
  <div class="env" id="hoja-general"></div>

  <!-- ══════ Hoja: catálogo ══════ -->
  <div class="env oculto" id="hoja-catalogo">
    <div class="buscar">
      <input type="search" id="filtro" placeholder="Buscar un producto…" autocomplete="off">
    </div>
    <p class="sin-resultados oculto" id="sin-resultados">Ningún producto coincide con esa búsqueda.</p>
    <div id="categorias"></div>
    <div class="fila-botones">
      <button class="neutro" id="add-categoria">+ Agregar sección</button>
    </div>
  </div>

  <div class="barra">
    <div class="env">
      <button class="primario" id="guardar">Guardar cambios</button>
      <span class="aviso" id="estado"></span>
    </div>
  </div>
</div>

<!-- Un solo selector de archivos para todo el panel: crear uno por
     producto llenaría la página de elementos que casi nunca se usan. -->
<input type="file" id="selector-foto" accept="image/*" class="oculto">

<script>
/*
 * Todo el estado vive en `datos`. Los campos escriben directo sobre ese
 * objeto según se teclea, y "Guardar" manda el objeto completo. No se
 * guarda solo a propósito: Manuel tiene que poder equivocarse y recargar
 * la página sin haber roto nada.
 *
 * Las fotos son la excepción: esas sí suben en el momento, porque lo que
 * se guarda en el catálogo es solo su dirección.
 */
(function () {
  var datos = { categorias: [] };
  var sitio = {};
  var sucio = false;       /* el catálogo */
  var sucioSitio = false;  /* la información general */
  var cajaActiva = null;   /* a qué caja va la foto que se pegue */

  var $ = function (id) { return document.getElementById(id); };
  var mostrar = function (el, si) { el.classList.toggle('oculto', !si); };

  var aviso = function (texto, clase) {
    var e = $('estado');
    e.textContent = texto || '';
    e.className = 'aviso' + (clase ? ' ' + clase : '');
  };

  var marcarSucio = function () {
    sucio = true;
    aviso('Hay cambios sin guardar');
  };

  var marcarSucioSitio = function () {
    sucioSitio = true;
    aviso('Hay cambios sin guardar');
  };

  var hayCambios = function () { return sucio || sucioSitio; };

  /* ---------- Fotos ------------------------------------------ */

  /* Se reduce y se comprime aquí, en el navegador, antes de subir.
     Una foto de celular pesa varios megas y la tienda no necesita más
     de 1200 px de ancho; subirla entera por datos móviles sería lento
     y llenaría el almacén sin necesidad.

     El lienzo se pinta de blanco primero porque un PNG con fondo
     transparente, al pasar a JPG, se volvería negro. */
  var MAX_LADO = 1200;

  /* createImageBitmap no existe en navegadores viejos de iPhone; ahí se
     carga con una etiqueta <img>, que funciona en todos. */
  function abrirImagen(archivo) {
    if (typeof createImageBitmap === 'function') {
      return createImageBitmap(archivo).catch(function () { return porEtiqueta(archivo); });
    }
    return porEtiqueta(archivo);
  }

  function porEtiqueta(archivo) {
    return new Promise(function (listo, falla) {
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); listo(img); };
      img.onerror = function () { URL.revokeObjectURL(url); falla(new Error('No se pudo leer la imagen')); };
      img.src = url;
    });
  }

  /* `png` conserva la transparencia. Hace falta para el logo: pasado a
     JPG saldría con un recuadro blanco alrededor, que se nota encima del
     azul de la cabecera y del pie. */
  function prepararImagen(archivo, png) {
    return abrirImagen(archivo).then(function (fuente) {
      var anchoOrig = fuente.width || fuente.naturalWidth;
      var altoOrig = fuente.height || fuente.naturalHeight;
      var escala = Math.min(1, MAX_LADO / Math.max(anchoOrig, altoOrig));
      var ancho = Math.round(anchoOrig * escala);
      var alto = Math.round(altoOrig * escala);

      var lienzo = document.createElement('canvas');
      lienzo.width = ancho;
      lienzo.height = alto;
      var ctx = lienzo.getContext('2d');
      if (!png) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, ancho, alto);
      }
      ctx.drawImage(fuente, 0, 0, ancho, alto);
      if (fuente.close) fuente.close();

      return new Promise(function (listo, falla) {
        lienzo.toBlob(function (blob) {
          blob ? listo(blob) : falla(new Error('No se pudo preparar la imagen'));
        }, png ? 'image/png' : 'image/jpeg', 0.82);
      });
    });
  }

  function subirFoto(archivo, obj, campo, caja, opciones) {
    opciones = opciones || {};
    var pista = caja.querySelector('.pista');
    var decir = function (texto, malo) {
      pista.textContent = texto;
      pista.classList.toggle('malo', !!malo);
    };

    if (!archivo || archivo.type.indexOf('image/') !== 0) {
      decir('Eso no es una imagen.', true);
      return;
    }

    decir('Preparando la imagen…');
    prepararImagen(archivo, opciones.png)
      .then(function (blob) {
        decir('Subiendo…');
        return fetch('/api/foto', {
          method: 'POST',
          headers: { 'Content-Type': opciones.png ? 'image/png' : 'image/jpeg' },
          body: blob,
        });
      })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (!res.ok || !res.j.url) {
          throw new Error(res.j && res.j.error ? res.j.error : 'No se pudo subir');
        }
        obj[campo] = res.j.url;
        pintarFoto(caja, obj, campo);
        (opciones.alCambiar || marcarSucio)();
        decir('Foto lista. Falta guardar los cambios.');
      })
      .catch(function (err) {
        decir(err.message || 'No se pudo subir la foto', true);
      });
  }

  /* Repinta la caja de la foto y, si cuelga de un producto, también su
     miniatura del encabezado. */
  function pintarFoto(caja, obj, campo) {
    var previo = caja.querySelector('.vista, .hueco');
    var nuevo;
    if (obj[campo]) {
      nuevo = document.createElement('img');
      nuevo.className = 'vista';
      nuevo.src = obj[campo];
      nuevo.alt = '';
    } else {
      nuevo = document.createElement('div');
      nuevo.className = 'hueco';
      nuevo.textContent = '🖼️';
    }
    caja.replaceChild(nuevo, previo);

    mostrar(caja.querySelector('.quitar-foto'), !!obj[campo]);

    var fila = caja.closest('.producto');
    if (fila) refrescarResumen(fila, obj);
  }

  function cajaDeFoto(obj, campo, opciones) {
    opciones = opciones || {};
    var caja = document.createElement('div');
    caja.className = 'foto';
    caja.tabIndex = 0;

    var hueco = document.createElement('div');
    hueco.className = 'hueco';
    hueco.textContent = '🖼️';
    caja.appendChild(hueco);

    var texto = document.createElement('div');
    texto.className = 'texto';

    var acciones = document.createElement('div');
    acciones.className = 'acciones';

    var elegir = document.createElement('button');
    elegir.className = 'neutro chico';
    elegir.type = 'button';
    elegir.textContent = 'Elegir foto';
    elegir.addEventListener('click', function (ev) {
      ev.stopPropagation();
      abrirSelector(obj, campo, caja, opciones);
    });

    var quitar = document.createElement('button');
    quitar.className = 'peligro quitar-foto oculto';
    quitar.type = 'button';
    quitar.textContent = 'Quitar';
    quitar.addEventListener('click', function (ev) {
      ev.stopPropagation();
      obj[campo] = '';
      pintarFoto(caja, obj, campo);
      (opciones.alCambiar || marcarSucio)();
    });

    acciones.appendChild(elegir);
    acciones.appendChild(quitar);
    texto.appendChild(acciones);

    var pista = document.createElement('p');
    pista.className = 'pista';
    pista.textContent = 'Arrastra una imagen aquí, o toca la caja y pega con Ctrl+V.';
    texto.appendChild(pista);

    caja.appendChild(texto);

    /* Pegar: el evento solo llega al documento, así que hay que saber a
       qué producto mandarlo. Se recuerda la última caja tocada. */
    var activar = function () {
      if (cajaActiva && cajaActiva.caja !== caja) cajaActiva.caja.classList.remove('encima');
      cajaActiva = { caja: caja, obj: obj, campo: campo, opciones: opciones };
    };
    caja.addEventListener('focus', activar);
    caja.addEventListener('click', activar);

    caja.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      caja.classList.add('encima');
    });
    caja.addEventListener('dragleave', function () { caja.classList.remove('encima'); });
    caja.addEventListener('drop', function (ev) {
      ev.preventDefault();
      caja.classList.remove('encima');
      var archivo = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (archivo) subirFoto(archivo, obj, campo, caja, opciones);
    });

    pintarFoto(caja, obj, campo);
    return caja;
  }

  /* El selector de archivos es uno solo; se le cuelga a quién sirve
     justo antes de abrirlo. */
  var destinoSelector = null;
  function abrirSelector(obj, campo, caja, opciones) {
    destinoSelector = { obj: obj, campo: campo, caja: caja, opciones: opciones };
    var sel = $('selector-foto');
    sel.value = '';
    sel.click();
  }
  $('selector-foto').addEventListener('change', function () {
    var archivo = this.files && this.files[0];
    var d = destinoSelector;
    if (archivo && d) subirFoto(archivo, d.obj, d.campo, d.caja, d.opciones);
  });

  document.addEventListener('paste', function (ev) {
    if (!cajaActiva) return;
    var items = (ev.clipboardData && ev.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        ev.preventDefault();
        var a = cajaActiva;
        subirFoto(items[i].getAsFile(), a.obj, a.campo, a.caja, a.opciones);
        return;
      }
    }
  });

  /* ---------- Pintar ---------------------------------------- */

  var campo = function (etiqueta, valor, alCambiar, tipo) {
    var cont = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = etiqueta;
    var inp = document.createElement('input');
    inp.type = tipo || 'text';
    inp.value = valor == null ? '' : valor;
    if (tipo === 'number') { inp.min = '0'; inp.inputMode = 'decimal'; }
    inp.addEventListener('input', function () { alCambiar(inp.value); marcarSucio(); });
    lab.appendChild(inp);
    cont.appendChild(lab);
    return cont;
  };

  /* El encabezado cerrado del producto: miniatura, nombre y cuántos
     precios tiene. Se recalcula cuando cambia cualquiera de los tres. */
  function refrescarResumen(fila, prod) {
    var res = fila.querySelector('summary');
    var previo = res.querySelector('.mini');
    var nuevo;
    if (prod.imagen) {
      nuevo = document.createElement('img');
      nuevo.className = 'mini';
      nuevo.src = prod.imagen;
      nuevo.alt = '';
      nuevo.loading = 'lazy';
    } else {
      nuevo = document.createElement('div');
      nuevo.className = 'mini vacia';
      nuevo.textContent = '🖼️';
    }
    res.replaceChild(nuevo, previo);

    var titulo = res.querySelector('.titulo');
    titulo.textContent = prod.nombre || 'Producto sin nombre';
    titulo.classList.toggle('vacio', !prod.nombre);

    var n = (prod.precios || []).length;
    res.querySelector('.cuantos').textContent = n === 1 ? '1 precio' : n + ' precios';

    fila.dataset.nombre = (prod.nombre || '').toLowerCase();
  }

  var pintarProducto = function (cat, prod, i) {
    var fila = document.createElement('details');
    fila.className = 'producto';

    var res = document.createElement('summary');
    res.appendChild(document.createElement('div')).className = 'mini vacia';
    var titulo = document.createElement('div');
    titulo.className = 'titulo';
    res.appendChild(titulo);
    var cuantos = document.createElement('span');
    cuantos.className = 'cuantos';
    res.appendChild(cuantos);
    fila.appendChild(res);

    var caja = document.createElement('div');
    caja.className = 'cuerpo';
    fila.appendChild(caja);

    caja.appendChild(campo('Nombre del producto', prod.nombre, function (v) {
      prod.nombre = v;
      refrescarResumen(fila, prod);
    }));
    caja.appendChild(campo('Descripción', prod.descripcion, function (v) { prod.descripcion = v; }));
    caja.appendChild(campo('Etiqueta corta', prod.etiqueta, function (v) { prod.etiqueta = v; }));

    var etiquetaFoto = document.createElement('label');
    etiquetaFoto.textContent = 'Foto';
    caja.appendChild(etiquetaFoto);
    caja.appendChild(cajaDeFoto(prod, 'imagen'));

    var titulo2 = document.createElement('label');
    titulo2.textContent = 'Presentaciones y precios';
    caja.appendChild(titulo2);

    var lista = document.createElement('div');
    caja.appendChild(lista);

    var pintarPrecios = function () {
      lista.innerHTML = '';
      (prod.precios || []).forEach(function (precio, j) {
        var linea = document.createElement('div');
        linea.className = 'precio';
        linea.appendChild(campo('Presentación', precio.tamano, function (v) { precio.tamano = v; }));
        linea.appendChild(campo('RD$', precio.monto, function (v) { precio.monto = Number(v); }, 'number'));
        var quitar = document.createElement('button');
        quitar.className = 'peligro';
        quitar.type = 'button';
        quitar.textContent = 'Quitar';
        quitar.addEventListener('click', function () {
          prod.precios.splice(j, 1);
          pintarPrecios();
          refrescarResumen(fila, prod);
          marcarSucio();
        });
        linea.appendChild(quitar);
        lista.appendChild(linea);
      });
    };
    pintarPrecios();

    var botones = document.createElement('div');
    botones.className = 'fila-botones';

    var masPrecio = document.createElement('button');
    masPrecio.className = 'neutro chico';
    masPrecio.type = 'button';
    masPrecio.textContent = '+ Otra presentación';
    masPrecio.addEventListener('click', function () {
      prod.precios = prod.precios || [];
      prod.precios.push({ tamano: '', monto: 0 });
      pintarPrecios();
      refrescarResumen(fila, prod);
      marcarSucio();
    });

    var borrar = document.createElement('button');
    borrar.className = 'peligro';
    borrar.type = 'button';
    borrar.textContent = 'Eliminar producto';
    borrar.addEventListener('click', function () {
      if (!confirm('¿Eliminar "' + (prod.nombre || 'este producto') + '"?')) return;
      cat.productos.splice(i, 1);
      pintar();
      marcarSucio();
    });

    botones.appendChild(masPrecio);
    botones.appendChild(borrar);
    caja.appendChild(botones);

    refrescarResumen(fila, prod);
    return fila;
  };

  var pintar = function () {
    var cont = $('categorias');
    cont.innerHTML = '';

    datos.categorias.forEach(function (cat, ci) {
      var det = document.createElement('details');
      det.className = 'tarjeta categoria';

      var res = document.createElement('summary');
      var nombre = document.createElement('span');
      nombre.style.cssText = 'font-weight:800;font-size:17px;color:var(--azul)';
      nombre.textContent = cat.nombre || '(sección sin nombre)';
      res.appendChild(nombre);
      var cuenta = document.createElement('span');
      var n = (cat.productos || []).length;
      cuenta.textContent = n === 1 ? '1 producto' : n + ' productos';
      res.appendChild(cuenta);
      det.appendChild(res);

      det.appendChild(campo('Nombre de la sección', cat.nombre, function (v) {
        cat.nombre = v;
        nombre.textContent = v || '(sección sin nombre)';
      }));

      (cat.productos || []).forEach(function (prod, pi) {
        det.appendChild(pintarProducto(cat, prod, pi));
      });

      var botones = document.createElement('div');
      botones.className = 'fila-botones';

      var masProd = document.createElement('button');
      masProd.className = 'neutro chico';
      masProd.type = 'button';
      masProd.textContent = '+ Agregar producto';
      masProd.addEventListener('click', function () {
        cat.productos = cat.productos || [];
        cat.productos.push({ nombre: '', imagen: '', etiqueta: '', destacado: false, descripcion: '', precios: [{ tamano: '', monto: 0 }] });
        det.setAttribute('open', '');
        pintar();
        marcarSucio();
      });

      var borrarCat = document.createElement('button');
      borrarCat.className = 'peligro';
      borrarCat.type = 'button';
      borrarCat.textContent = 'Eliminar sección';
      borrarCat.addEventListener('click', function () {
        if (!confirm('¿Eliminar la sección "' + (cat.nombre || 'sin nombre') + '" y sus productos?')) return;
        datos.categorias.splice(ci, 1);
        pintar();
        marcarSucio();
      });

      botones.appendChild(masProd);
      botones.appendChild(borrarCat);
      det.appendChild(botones);
      cont.appendChild(det);
    });

    filtrar();
  };

  /* ---------- Información general ---------------------------- */

  var TIPOS_RED = [
    ['instagram', 'Instagram'],
    ['tiktok', 'TikTok'],
    ['facebook', 'Facebook'],
    ['youtube', 'YouTube'],
    ['otro', 'Otra'],
  ];

  /* Igual que `campo`, pero escribiendo sobre la información general.
     Se separan porque son dos guardados distintos: uno va a /api/site y
     el otro a /api/catalogo. */
  var campoSitio = function (etiqueta, valor, alCambiar, nota) {
    var cont = document.createElement('div');
    var lab = document.createElement('label');
    lab.textContent = etiqueta;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.value = valor == null ? '' : valor;
    inp.addEventListener('input', function () { alCambiar(inp.value); marcarSucioSitio(); });
    lab.appendChild(inp);
    cont.appendChild(lab);
    if (nota) {
      var p = document.createElement('p');
      p.className = 'nota';
      p.textContent = nota;
      cont.appendChild(p);
    }
    return cont;
  };

  var grupo = function (titulo) {
    var g = document.createElement('div');
    g.className = 'grupo tarjeta';
    var h = document.createElement('h2');
    h.textContent = titulo;
    g.appendChild(h);
    return g;
  };

  function pintarGeneral() {
    var cont = $('hoja-general');
    cont.innerHTML = '';

    sitio.contacto = sitio.contacto || {};
    sitio.whatsapp = sitio.whatsapp || {};
    sitio.medios = sitio.medios || {};
    sitio.redes = Array.isArray(sitio.redes) ? sitio.redes : [];

    /* ── Logo ── */
    var gLogo = grupo('Logo');
    var etiqueta = document.createElement('label');
    etiqueta.textContent = 'Imagen del logo';
    gLogo.appendChild(etiqueta);
    gLogo.appendChild(cajaDeFoto(sitio.medios, 'logo', {
      png: true,
      alCambiar: marcarSucioSitio,
    }));
    var notaLogo = document.createElement('p');
    notaLogo.className = 'nota';
    notaLogo.textContent = 'Se guarda en PNG para que el fondo transparente no salga como un cuadro blanco sobre el azul.';
    gLogo.appendChild(notaLogo);
    cont.appendChild(gLogo);

    /* ── Contacto ── */
    var gCont = grupo('Contacto');
    gCont.appendChild(campoSitio('Teléfono de la tienda', sitio.contacto.telefono_visible,
      function (v) { sitio.contacto.telefono_visible = v; }));
    gCont.appendChild(campoSitio('WhatsApp como se muestra', sitio.contacto.whatsapp_visible,
      function (v) { sitio.contacto.whatsapp_visible = v; },
      'Es solo lo que lee el cliente. El que abre el chat es el de abajo.'));
    gCont.appendChild(campoSitio('Número que abre el chat', sitio.whatsapp.numero,
      function (v) { sitio.whatsapp.numero = v; },
      'Con el código del país y sin espacios ni guiones. Ejemplo: 18293795820.'));
    gCont.appendChild(campoSitio('Mensaje con el que empieza el chat', sitio.whatsapp.mensaje_general,
      function (v) { sitio.whatsapp.mensaje_general = v; }));
    gCont.appendChild(campoSitio('Correo', sitio.contacto.correo,
      function (v) { sitio.contacto.correo = v; }));
    gCont.appendChild(campoSitio('Dirección', sitio.contacto.direccion,
      function (v) { sitio.contacto.direccion = v; }));
    cont.appendChild(gCont);

    /* ── Redes ── */
    var gRedes = grupo('Redes sociales');
    var lista = document.createElement('div');
    gRedes.appendChild(lista);

    var pintarRedes = function () {
      lista.innerHTML = '';
      sitio.redes.forEach(function (red, i) {
        var caja = document.createElement('div');
        caja.className = 'red';

        var lab = document.createElement('label');
        lab.textContent = 'Red';
        var sel = document.createElement('select');
        TIPOS_RED.forEach(function (par) {
          var op = document.createElement('option');
          op.value = par[0];
          op.textContent = par[1];
          sel.appendChild(op);
        });
        sel.value = red.tipo || 'otro';
        lab.appendChild(sel);
        caja.appendChild(lab);

        var campoNombre = campoSitio('Nombre que se muestra', red.nombre, function (v) { red.nombre = v; });
        caja.appendChild(campoNombre);

        /* Al elegir una red conocida se rellena el nombre, pero también
           en la casilla: si solo se cambiara el dato, el campo quedaría
           en blanco y parecería que no se guardó. */
        sel.addEventListener('change', function () {
          red.tipo = sel.value;
          var conocido = TIPOS_RED.find(function (p) { return p[0] === sel.value; });
          if (conocido && sel.value !== 'otro') {
            red.nombre = conocido[1];
            campoNombre.querySelector('input').value = conocido[1];
          }
          marcarSucioSitio();
        });
        caja.appendChild(campoSitio('Usuario', red.usuario, function (v) { red.usuario = v; }));
        caja.appendChild(campoSitio('Enlace', red.enlace, function (v) { red.enlace = v; },
          'La dirección completa, empezando por https://'));

        var quitar = document.createElement('button');
        quitar.className = 'peligro';
        quitar.type = 'button';
        quitar.textContent = 'Quitar esta red';
        quitar.style.marginTop = '12px';
        quitar.addEventListener('click', function () {
          if (!confirm('¿Quitar ' + (red.nombre || 'esta red') + ' del pie de la página?')) return;
          sitio.redes.splice(i, 1);
          pintarRedes();
          marcarSucioSitio();
        });
        caja.appendChild(quitar);

        lista.appendChild(caja);
      });
    };
    pintarRedes();

    var botones = document.createElement('div');
    botones.className = 'fila-botones';
    var mas = document.createElement('button');
    mas.className = 'neutro chico';
    mas.type = 'button';
    mas.textContent = '+ Agregar red';
    mas.addEventListener('click', function () {
      sitio.redes.push({ tipo: 'otro', nombre: '', usuario: '', enlace: '' });
      pintarRedes();
      marcarSucioSitio();
    });
    botones.appendChild(mas);
    gRedes.appendChild(botones);
    cont.appendChild(gRedes);
  }

  /* ---------- Pestañas --------------------------------------- */

  document.querySelectorAll('.pestanas button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.pestanas button').forEach(function (o) {
        o.classList.toggle('activa', o === b);
      });
      mostrar($('hoja-general'), b.dataset.hoja === 'general');
      mostrar($('hoja-catalogo'), b.dataset.hoja === 'catalogo');
      window.scrollTo(0, 0);
    });
  });

  /* ---------- Buscar ---------------------------------------- */

  function filtrar() {
    var texto = $('filtro').value.trim().toLowerCase();
    var visibles = 0;

    document.querySelectorAll('.categoria').forEach(function (cat) {
      var coinciden = 0;
      cat.querySelectorAll('.producto').forEach(function (fila) {
        var pasa = !texto || (fila.dataset.nombre || '').indexOf(texto) >= 0;
        fila.classList.toggle('oculto', !pasa);
        if (pasa) coinciden++;
      });
      visibles += coinciden;

      if (texto) {
        cat.classList.toggle('oculto', coinciden === 0);
        if (coinciden) cat.setAttribute('open', '');
      } else {
        cat.classList.remove('oculto');
      }
    });

    mostrar($('sin-resultados'), !!texto && visibles === 0);
  }

  $('filtro').addEventListener('input', filtrar);

  /* ---------- Servidor --------------------------------------- */

  var cargar = function () {
    return Promise.all([
      fetch('/api/catalogo').then(function (r) { return r.json(); }),
      fetch('/api/site').then(function (r) { return r.json(); }),
    ]).then(function (par) {
      var d = par[0];
      datos = d && Array.isArray(d.categorias) ? d : { categorias: [] };
      sitio = par[1] && typeof par[1] === 'object' ? par[1] : {};
      pintarGeneral();
      pintar();
      aviso('');
      sucio = false;
      sucioSitio = false;
    });
  };

  var entrar = function () {
    mostrar($('entrada'), false);
    mostrar($('editor'), true);
    cargar();
  };

  $('form-entrar').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('error-entrar');
    mostrar(err, false);
    fetch('/api/sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clave: $('clave').value }),
    })
      .then(function (r) { return r.ok ? entrar() : Promise.reject(); })
      .catch(function () {
        err.textContent = 'Contraseña incorrecta.';
        mostrar(err, true);
        $('clave').select();
      });
  });

  $('salir').addEventListener('click', function () {
    if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Salir de todos modos?')) return;
    fetch('/api/sesion', { method: 'DELETE' }).then(function () { location.reload(); });
  });

  $('add-categoria').addEventListener('click', function () {
    datos.categorias.push({ id: 'seccion-' + Date.now().toString(36), nombre: '', icono: '', productos: [] });
    pintar();
    marcarSucio();
  });

  /* Un solo botón para las dos hojas: manda solo la que cambió, pero si
     falla cualquiera lo dice, para que nadie se vaya creyendo que quedó
     guardado lo que no. */
  function mandar(ruta, cuerpo) {
    return fetch(ruta, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : 'No se pudo guardar');
      });
  }

  $('guardar').addEventListener('click', function () {
    if (!hayCambios()) { aviso('No hay nada que guardar'); return; }
    aviso('Guardando…');

    var tareas = [];
    if (sucioSitio) tareas.push(mandar('/api/site', sitio).then(function () { sucioSitio = false; }));
    if (sucio) tareas.push(mandar('/api/catalogo', datos).then(function () { sucio = false; }));

    Promise.all(tareas)
      .then(function () { aviso('Guardado. Ya se ve en la página.', 'bien'); })
      .catch(function (err) { aviso(err.message || 'No se pudo guardar', 'malo'); });
  });

  window.addEventListener('beforeunload', function (e) {
    if (hayCambios()) { e.preventDefault(); e.returnValue = ''; }
  });

  /* Si la cookie sigue viva, se entra directo. */
  fetch('/api/sesion')
    .then(function (r) { return r.json(); })
    .then(function (s) { if (s && s.ok) entrar(); });
})();
</script>
</body>
</html>
